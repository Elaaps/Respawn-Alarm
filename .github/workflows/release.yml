name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release

defaults:
  run:
    shell: bash

env:
  BUILD_TOOLS_VERSION: "37.0.0"
  RELEASE_CERT_SHA256: "379b2111978d4ba4508df8cc959d1c2fb9ebe8074db3d7c884fa833d6227dce6"

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Install the Android SDK packages
        run: >
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Check that the tag matches versionName
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match versionName ${version}: nothing was published."
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Write the signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="${RUNNER_TEMP}/release.jks"
          base64 --decode <<<"${KEYSTORE_BASE64}" >"${keystore}"
          cat >keystore.properties <<EOF
          storeFile=${keystore}
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Test, lint and build
        run: ./gradlew --console=plain testDebugUnitTest lintRelease assembleRelease

      - name: Remove the signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks" keystore.properties

      - name: Check the signature
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner() {
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" \
              -J-enable-native-access=ALL-UNNAMED "$@"
          }
          built=app/build/outputs/apk/release/app-release.apk
          apksigner verify "${built}"
          signer=$(apksigner verify --print-certs "${built}" |
            sed -n '/[Ss]igner.*certificate SHA-256 digest:/{s/^.*digest: *//p;q}')
          if [[ "${signer}" != "${RELEASE_CERT_SHA256}" ]]; then
            echo "::error::The APK is signed by ${signer:-an unknown key}, not the release key: nothing was published."
            exit 1
          fi
          apk="respawn-alarm-${VERSION}.apk"
          mv "${built}" "${apk}"
          echo "path=${apk}" >>"${GITHUB_OUTPUT}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            if [[ -z "${previous}" ]]; then
              echo "First release on GitHub."
            else
              git log --format='- %s' "${previous}..${TAG}" | grep -E '^- (feat|fix|perf)[(!:]' || true
              echo
              echo "**Full changelog**: https://github.com/${REPOSITORY}/compare/${previous}...${TAG}"
            fi
          } >"${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "${TAG}" --draft --verify-tag \
            --title "Respawn Alarm ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
          gh release upload "${TAG}" "${APK}"
          gh release edit "${TAG}" --draft=false
